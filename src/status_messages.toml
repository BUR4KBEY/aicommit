# Rotating status details shown next to the spinner stage while the AI works.
# Copy this file to ~/.aicommit-status.toml to override any section; sections
# you leave out (or leave empty) keep these built-in messages.

[waiting]
messages = [
    "reading the diff",
    "weighing the changes",
    "waiting on the model",
    "thinking in conventional commits",
    "choosing the perfect emoji",
    "resisting the urge to write 'fix stuff'",
    "wondering what 'wip' really meant",
    "reading between the changed lines",
    "considering the bigger picture",
    "practicing commit message minimalism",
    "checking if this counts as a feat or a fix",
    "appreciating a well-named variable",
    "sizing up the blast radius",
    "hoping the tests were updated too",
]

[splitting]
messages = [
    "counting tokens",
    "grouping hunks",
    "packing chunks under the budget",
    "slicing the diff into bite-sized pieces",
    "negotiating with the token budget",
    "portioning out the changes",
    "measuring twice, chunking once",
    "playing tetris with hunks",
    "drawing chunk boundaries responsibly",
]

[summary]
messages = [
    "condensing changes",
    "noting renames and moves",
    "reading test updates",
    "tracking file-level intent",
    "squinting at the whitespace changes",
    "quietly admiring the refactor",
    "boiling this chunk down to its essence",
    "spotting the load-bearing change",
    "filing the plot points for later",
    "separating signal from churn",
    "taking notes like it's a lecture",
]

[synthesis]
messages = [
    "merging chunk summaries",
    "weighing candidate subjects",
    "drafting the final wording",
    "debating the scope name",
    "trimming the subject line",
    "assembling the full story",
    "reconciling conflicting narratives",
    "picking a verb with conviction",
    "sanding down the rough edges",
    "resisting a second bullet point",
]

# Occasionally swapped in regardless of stage. Keep these short and fun.
[rare]
messages = [
    "consulting the commit message elders",
    "rolling a d20 for the gitmoji",
    "asking git to be reasonable",
    "pretending to read Cargo.lock",
    "aligning the semicolons spiritually",
    "blaming git blame",
    "whispering encouragement to the CI",
    "checking under the merge conflicts for loose change",
    "wondering who force-pushed to main",
    "counting to HEAD~1 and back",
    "interrogating a suspicious TODO",
    "petting the repository gently",
    "rehearsing the changelog voice",
    "untangling the branch name's backstory",
]
